[project]
name = "l1-robust-miljohantering"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "jupyter",
  "pandas",
  "scikit-learn",
  "torch",
  "torchvision",
  "torchaudio",
  "pyyaml>=6.0.3",
  "tqdm>=4.67.3",
  "dvc>=3.66.1",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
